<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galerie — Veterinární klinika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/design-3/theme.css" />
  </head>
  <body class="page-galerie">
    <header class="site-header is-solid" id="header">
      <div class="container">
        <a class="brand" href="/design-3/prezentacni/index.html">Veterinární klinika</a>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <nav class="nav" id="nav">
          <a href="/design-3/prezentacni/sluzby/index.html">Služby</a>
          <a href="/design-3/prezentacni/cenik.html">Ceník</a>
          <a href="/design-3/prezentacni/pohotovost.html">Pohotovost</a>
          <a href="/design-3/prezentacni/tym.html">Tým</a>
          <a href="/design-3/prezentacni/galerie.html">Galerie</a>
          <a href="/design-3/prezentacni/recenze.html">Recenze</a>
          <a href="/design-3/prezentacni/index.html#kontakt">Kontakt</a>
        </nav>
      </div>
    </header>

    <main>
      <header class="page-hero" data-shot="prostor">
        <div class="page-hero-media" aria-hidden="true"></div>
        <div class="container page-hero-inner reveal">
          <p class="page-hero-kicker">Galerie</p>
          <h1>Čekárna a ordinace</h1>
          <p class="page-hero-lead">
            Ukázkové fotografie prostor — klinika je nahradí vlastními snímky.
          </p>
        </div>
      </header>

      <section class="section gallery-section">
        <div class="container reveal">
          <div class="opal-gallery" id="opalGallery">
            <div class="opal-gallery-row opal-gallery-row--lead">
              <button
                class="opal-gallery-item opal-gallery-item--hero"
                type="button"
                data-gallery-index="0"
                data-label="Čekárna"
                data-eyebrow="Prostor"
                data-caption="Prostor klidu před vyšetřením"
                aria-label="Otevřít fotografii: Čekárna"
              >
                <span class="opal-gallery-shot gallery-waiting" aria-hidden="true"></span>
                <span class="opal-gallery-hint" aria-hidden="true">Otevřít</span>
                <span class="opal-gallery-caption">
                  <span class="opal-gallery-eyebrow">Prostor</span>
                  <span class="opal-gallery-title">Čekárna</span>
                </span>
              </button>
              <div class="opal-gallery-stack">
                <button
                  class="opal-gallery-item opal-gallery-item--tile"
                  type="button"
                  data-gallery-index="1"
                  data-label="Vyšetřovna"
                  data-caption="Ordinace pro klidné vyšetření"
                  aria-label="Otevřít fotografii: Vyšetřovna"
                >
                  <span class="opal-gallery-shot gallery-exam" aria-hidden="true"></span>
                  <span class="opal-gallery-hint" aria-hidden="true">Otevřít</span>
                </button>
                <button
                  class="opal-gallery-item opal-gallery-item--tile"
                  type="button"
                  data-gallery-index="2"
                  data-label="Recepce"
                  data-caption="První kontakt s klinikou"
                  aria-label="Otevřít fotografii: Recepce"
                >
                  <span class="opal-gallery-shot gallery-desk" aria-hidden="true"></span>
                  <span class="opal-gallery-hint" aria-hidden="true">Otevřít</span>
                </button>
              </div>
            </div>

            <div class="opal-gallery-row opal-gallery-row--reverse">
              <div class="opal-gallery-stack">
                <button
                  class="opal-gallery-item opal-gallery-item--tile"
                  type="button"
                  data-gallery-index="3"
                  data-label="Péče o pacienty"
                  data-caption="Jemná a soustředěná péče"
                  aria-label="Otevřít fotografii: Péče o pacienty"
                >
                  <span class="opal-gallery-shot gallery-care" aria-hidden="true"></span>
                  <span class="opal-gallery-hint" aria-hidden="true">Otevřít</span>
                </button>
                <button
                  class="opal-gallery-item opal-gallery-item--tile"
                  type="button"
                  data-gallery-index="4"
                  data-label="Preventivní péče"
                  data-caption="Očkování a běžná prevence"
                  aria-label="Otevřít fotografii: Preventivní péče"
                >
                  <span class="opal-gallery-shot gallery-prevent" aria-hidden="true"></span>
                  <span class="opal-gallery-hint" aria-hidden="true">Otevřít</span>
                </button>
              </div>
              <button
                class="opal-gallery-item opal-gallery-item--hero"
                type="button"
                data-gallery-index="5"
                data-label="Akutní péče"
                data-eyebrow="Péče"
                data-caption="Připravené zázemí pro akutní situace"
                aria-label="Otevřít fotografii: Akutní péče"
              >
                <span class="opal-gallery-shot gallery-surgery" aria-hidden="true"></span>
                <span class="opal-gallery-hint" aria-hidden="true">Otevřít</span>
                <span class="opal-gallery-caption">
                  <span class="opal-gallery-eyebrow">Péče</span>
                  <span class="opal-gallery-title">Akutní péče</span>
                </span>
              </button>
            </div>

            <div class="opal-gallery-row opal-gallery-row--wide">
              <button
                class="opal-gallery-item opal-gallery-item--wide"
                type="button"
                data-gallery-index="6"
                data-label="Prostor kliniky"
                data-eyebrow="Prostor"
                data-caption="Atmosféra moderní veterinární péče"
                aria-label="Otevřít fotografii: Prostor kliniky"
              >
                <span class="opal-gallery-shot gallery-room" aria-hidden="true"></span>
                <span class="opal-gallery-hint" aria-hidden="true">Otevřít</span>
                <span class="opal-gallery-caption">
                  <span class="opal-gallery-eyebrow">Prostor</span>
                  <span class="opal-gallery-title">Prostor kliniky</span>
                </span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="opal-lightbox" id="opalLightbox" hidden>
      <div class="opal-lightbox-backdrop" data-lightbox-close tabindex="-1"></div>
      <button class="opal-lightbox-close" type="button" data-lightbox-close aria-label="Zavřít">
        <span aria-hidden="true">×</span>
      </button>
      <button class="opal-lightbox-nav opal-lightbox-nav--prev" type="button" data-lightbox-prev aria-label="Předchozí">
        <span aria-hidden="true">←</span>
      </button>
      <button class="opal-lightbox-nav opal-lightbox-nav--next" type="button" data-lightbox-next aria-label="Další">
        <span aria-hidden="true">→</span>
      </button>
      <figure class="opal-lightbox-stage">
        <div class="opal-lightbox-shot" id="opalLightboxShot" role="img"></div>
        <figcaption class="opal-lightbox-meta">
          <span class="opal-lightbox-eyebrow" id="opalLightboxEyebrow"></span>
          <strong id="opalLightboxTitle"></strong>
          <span id="opalLightboxCaption"></span>
        </figcaption>
      </figure>
    </div>

    <footer class="site-footer">
      <div class="container">
        <span>Veterinární klinika</span>
        <span>Opal Vettet · prezenční web</span>
      </div>
    </footer>
    <script src="/shared/site.js"></script>
    <script src="/design-3/galerie.js"></script>
  <script src="../../protect.js" defer></script></body>
</html>
