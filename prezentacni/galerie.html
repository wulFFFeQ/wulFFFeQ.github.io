<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galerie — Veterinární klinika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared/theme.css" />
  </head>
  <body>
    <header class="site-header is-solid" id="header">
      <div class="container">
        <a class="brand" href="/prezentacni/index.html">Veterinární klinika</a>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <nav class="nav" id="nav">
          <a href="/prezentacni/sluzby/index.html">Služby</a>
          <a href="/prezentacni/pohotovost.html">Pohotovost</a>
          <a href="/prezentacni/cenik.html">Ceník</a>
          <a href="/prezentacni/tym.html">Tým</a>
          <a href="/prezentacni/galerie.html" aria-current="page">Galerie</a>
          <a href="/prezentacni/recenze.html">Recenze</a>
          <a href="/prezentacni/index.html#kontakt">Kontakt</a>
        </nav>
      </div>
    </header>

    <main>
      <header class="page-hero">
        <div class="container">
          <span class="section-label">Galerie</span>
          <h1>Čekárna a ordinace</h1>
          <p>Ukázkové fotografie prostor — klinika je nahradí vlastními snímky.</p>
        </div>
      </header>

      <section class="section gallery-section">
        <div class="container">
          <div class="gallery-album reveal">
            <figure class="gallery-shot" style="--i: 0">
              <div
                class="gallery-photo gallery-waiting"
                role="img"
                aria-label="Čekárna"
              ></div>
              <figcaption><span>01</span> Čekárna</figcaption>
            </figure>
            <figure class="gallery-shot" style="--i: 1">
              <div
                class="gallery-photo gallery-exam"
                role="img"
                aria-label="Vyšetřovna"
              ></div>
              <figcaption><span>02</span> Vyšetřovna</figcaption>
            </figure>
            <figure class="gallery-shot" style="--i: 2">
              <div
                class="gallery-photo gallery-desk"
                role="img"
                aria-label="Recepce"
              ></div>
              <figcaption><span>03</span> Recepce</figcaption>
            </figure>
            <figure class="gallery-shot" style="--i: 3">
              <div
                class="gallery-photo gallery-room"
                role="img"
                aria-label="Prostor kliniky"
              ></div>
              <figcaption><span>04</span> Prostor kliniky</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>Veterinární klinika</span>
        <span>Varianta 1 · prezenční web</span>
      </div>
    </footer>
    <script src="/shared/site.js"></script>
  <script src="../protect.js" defer></script></body>
</html>
